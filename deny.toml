[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive crates pulled in by gpui-kit, comrak, and postcard. None are
# workspace crates; ignore until those libraries ship upgrades.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust via comrak/syntect; no upgrade on the comrak 0.41 line" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via gpui-kit; no upgrade in gpui-kit 0.8.1" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader via gpui-kit; no upgrade in gpui-kit 0.8.1" },
    { id = "RUSTSEC-2026-0009", reason = "stack exhaustion in a gpui-kit transitive parser; not used on untrusted XML" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
