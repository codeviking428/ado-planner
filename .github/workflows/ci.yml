name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # E2E launches Electron via Playwright `_electron`, not Chromium/Firefox/WebKit.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm exec electron-vite build

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E
        run: xvfb-run -a pnpm exec playwright test -c e2e/playwright.config.ts

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # PR runs reuse master's cache but don't overwrite it.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-deny

      - name: Linux GPUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev cmake pkg-config libfontconfig1-dev libfreetype6-dev clang xvfb

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        if: runner.os != 'Linux'
        run: cargo nextest run --workspace --locked

      - name: Tests
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo nextest run --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

      - name: Version flag
        shell: bash
        run: |
          set -euo pipefail
          want="ado-planner $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "ado-planner") | .version')"
          got="$(./target/debug/ado-planner --version | tr -d '\r')"
          echo "$got"
          [ "$got" = "$want" ]

      - name: Deny
        run: cargo deny check

  workflows:
    name: Workflows and release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck,shfmt

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

      - name: shellcheck and shfmt
        run: |
          shellcheck .github/scripts/*.sh
          shfmt -d .github/scripts/*.sh

      - name: Updater feed tests
        run: python3 .github/scripts/test_write_rust_latest_json.py

      - name: Versions agree
        run: .github/scripts/release-version.sh check

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges make the PR title the commit on master, and git-cliff
      # picks the next version from those commits.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
