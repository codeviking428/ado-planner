[package]
name = "ado-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ADO Planner native GPUI app"
publish = false
default-run = "ado-planner"

[[bin]]
name = "ado-planner"
path = "src/main.rs"

[lib]
name = "ado_planner"
path = "src/lib.rs"

[dependencies]
ado-client.workspace = true
ado-core.workspace = true
ado-session.workspace = true
async-trait.workspace = true
chrono = "0.4"
dirs.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
open.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
single-instance.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
urlencoding.workspace = true
cargo-packager-updater = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
ado-mock.workspace = true
gpui-kit = { version = "0.8.1", features = ["component", "assets", "test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.packager]
product-name = "ADO Planner"
identifier = "com.codeviking428.ado-planner"
before-packaging-command = "cargo build --release -p ado-planner"
formats = ["nsis", "appimage", "dmg"]
out-dir = "../../release/rust"
binaries = [{ path = "ado-planner", main = true }]
icons = ["../../build/icon.png", "../../build/icon.ico"]

# Installs to C:\Program Files\ADO Planner for all users and asks UAC for admin
# rights. The template removes a per-user install from releases up to 0.2.1 and
# starts the app unelevated afterwards; see packaging/windows/installer.nsi.
[package.metadata.packager.nsis]
installer-mode = "perMachine"
template = "packaging/windows/installer.nsi"

# cargo-packager has no updater table. src/updater.rs compiles in the feed URL
# and the minisign public key from ADO_PLANNER_UPDATER_ENDPOINT and
# ADO_PLANNER_UPDATER_PUBKEY at build time (see .github/workflows/release.yml).
# Without a key, local packages never check for updates.
