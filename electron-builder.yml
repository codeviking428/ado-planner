appId: com.ado-planner.app
productName: ADO Planner
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!assets/*'
  - '!e2e/*'
  - '!docs/*'
  - '!scripts/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
asarUnpack:
  - resources/**
forceCodeSigning: false
win:
  icon: assets/icons/ado-planner.ico
  executableName: ado-planner
nsis:
  oneClick: false
  perMachine: false
  artifactName: ${name}-electron-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: assets/icons/ado-planner.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
dmg:
  artifactName: ${name}-electron-${version}.${ext}
linux:
  # Files named <size>x<size>.png, installed into the hicolor theme.
  icon: assets/icons/png
  # StartupWMClass and the Wayland app_id come from desktopName, so docks
  # pair the running window with this launcher and its icon.
  syncDesktopName: true
  target:
    - AppImage
  maintainer: ado-planner
  category: Utility
appImage:
  artifactName: ${name}-electron-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: codeviking428
  repo: ado-planner
  releaseType: release
